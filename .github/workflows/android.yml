name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/android-branding.mjs
      - run: npx cap sync android
      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Package deliverable
        run: |
          mkdir -p deliverables
          cp android/app/build/outputs/apk/debug/app-debug.apk deliverables/Chess-Study.apk
          sha256sum deliverables/Chess-Study.apk > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Study-Android
          path: deliverables/
          retention-days: 90
